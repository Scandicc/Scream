<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; cursor: pointer; }
        
        /* ЭКРАН ЗАГРУЗКИ (МАСКИРОВКА) */
        .loader-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: #fff; text-align: center; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; opacity: 0.9; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s ease-in-out infinite; margin-bottom: 15px; }
        .status-text { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .percentage { font-size: 18px; color: #3b82f6; font-weight: bold; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ЭКРАН СКРИМЕРА (СКРЫТ ПО УМОЛЧАНИЮ) */
        .screamer-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20; background: #000; }
        .screamer-image { width: 100%; height: 100%; object-fit: cover; }
        
        /* ТРЯСКА КАРТИНКИ */
        .shake { animation: shakeAnim 0.05s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body onclick="activateScreamer()">

    <!-- Фейковое обновление Xiaomi -->
    <div class="loader-screen" id="loader">
        <div class="logo">Xiaomi HyperOS</div>
        <div class="spinner"></div>
        <div class="status-text">Оптимизация системы...</div>
        <div class="percentage">99%</div>
    </div>

    <!-- Скример (использует ваш сохраненный файл monster.jpg) -->
    <div class="screamer-screen" id="screamer">
        <img class="screamer-image shake" src="monster.jpg" alt="">
    </div>

    <!-- Звук (использует ваш сохраненный файл scream.mp3) -->
    <audio id="scream-audio" src="scream.mp3" preload="auto" loop></audio>

    <script>
        let triggered = false;

        function activateScreamer() {
            if (triggered) return;
            triggered = true;

            let elem = document.documentElement;
            
            // 1. Полноэкранный режим
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }

            // 2. Переключение экранов
            document.getElementById('loader').style.display = 'none';
            document.getElementById('screamer').style.display = 'flex';

            // 3. Запуск звука
            let audio = document.getElementById('scream-audio');
            audio.volume = 1.0;
            audio.play().catch(function(error) {
                console.log("Воспроизведение заблокировано:", error);
            });

            // 4. Бесконечная жесткая вибрация (паттерн: 400мс вибро, 100мс пауза)
            if (navigator.vibrate) {
                navigator.vibrate([400, 100, 400, 100]); // первый запуск мгновенно
                setInterval(function() {
                    navigator.vibrate([400, 100, 400, 100]);
                }, 1000);
            }
        }
    </script>

</body>
</html>
